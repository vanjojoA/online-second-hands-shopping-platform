# 校园二手集市 - 前端 Nginx 配置（同源部署）
#
# 使用方法：
#   1. 把 dist 里的内容上传到 /www/wwwroot/secondhand-frontend（index.html 要在这一层）
#   2. 宝塔 → 网站 → 添加站点（纯静态），根目录指向上面这个目录
#   3. 把下面 server 块里的 location 配置合并到站点配置的 server { } 中
#   4. nginx -t && nginx -s reload
#
# 前提：后端运行在 127.0.0.1:8080（Docker 映射到宿主机 8080）

server {
    listen 80;
    server_name 8.138.25.66;

    root /www/wwwroot/secondhand-frontend;
    index index.html;

    # 图片上传可能接近 10MB，Nginx 默认 1MB 会报 413
    client_max_body_size 50m;

    # Vue Router 使用 history 模式，刷新子路由不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端接口
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # 商品图片（后端 /images/** 映射到上传目录）
    # 也可以改成 alias /www/wwwroot/secondhand-uploads/; 由 Nginx 直接读文件
    location /images/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
    }

    # WebSocket 私信（必须有 Upgrade / Connection 头，否则聊天一直重连）
    location /ws/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # 带 hash 的静态资源可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # index.html 不做长缓存，保证发版后能拿到新版本
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
